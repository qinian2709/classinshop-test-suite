# classinshop-test-suite CI：运行接口自动化与 E2E，产出统一报告。
# 与其他仓库一致，按分支 13/14/im 触发；并支持定时（schedule）夜间回归。
#
# 需要在 GitLab CI/CD Variables 中配置（建议 Masked）：
#   TEST_TOKEN     被测环境某测试用户的 accessToken（接口/受保护用例需要）
#   MOBILE_BASE_URL  C 端 H5 店铺 URL（X-Shop-Domain），如 https://appi4rhoyxe1.shop14.eeo.im
#   TEST_GOODS_ID  （可选）用于正向算价的商品 ID
#   E2E_USERNAME / E2E_PASSWORD （可选）E2E 登录账号
#
# 报告（Enhanced HTML）：
#   - 测试 Job 自动生成到 reports/latest/enhanced/
#   - Job Artifacts 可在线浏览 / 下载
#   - pages Job 发布到 GitLab Pages，流水线结束后可在线打开

variables:
  # 官方 Playwright 镜像（自带浏览器）。若内网无法拉取，请改为内部镜像仓库地址。
  PLAYWRIGHT_IMAGE: 'mcr.microsoft.com/playwright:v1.61.0-jammy'
  PNPM_VERSION: '10'

workflow:
  rules:
    # 分支 13/14/im 推送时运行
    - if: $CI_COMMIT_BRANCH =~ /^(13|14|im)$/
    # 定时任务（夜间回归）运行
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # 合并请求运行（只跑接口冒烟）
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - prepare
  - test
  - report

# 根据分支推导被测环境；schedule / MR / 未知分支默认 14，可用 SCHEDULE_TEST_ENV 覆盖。
prepare:
  stage: prepare
  image: ${PLAYWRIGHT_IMAGE}
  script:
    - |
      if [ "${CI_PIPELINE_SOURCE}" = "schedule" ]; then
        test_env="${SCHEDULE_TEST_ENV:-14}"
      elif [ "${CI_PIPELINE_SOURCE}" = "merge_request_event" ]; then
        test_env="${SCHEDULE_TEST_ENV:-14}"
      else
        case "${CI_COMMIT_BRANCH}" in
          13) test_env="13" ;;
          14) test_env="14" ;;
          im) test_env="im" ;;
          *) test_env="14" ;;
        esac
      fi
      echo "TEST_ENV=$test_env" > deploy.env
      cat deploy.env
  artifacts:
    reports:
      dotenv: deploy.env

.install: &install
  - corepack enable
  - corepack prepare pnpm@${PNPM_VERSION} --activate
  - pnpm install --frozen-lockfile

.prepare_report_dirs: &prepare_report_dirs
  - mkdir -p reports/latest/enhanced reports/latest/html reports/latest/artifacts reports/latest/allure-results

.ensure_report_artifacts: &ensure_report_artifacts
  - mkdir -p reports/latest
  # 避免「No files to upload」把 Job 判失败：即使测试中途崩溃也保证目录/junit 存在
  - |
    if [ ! -f reports/latest/junit.xml ]; then
      printf '%s\n' \
        '<?xml version="1.0" encoding="UTF-8"?>' \
        '<testsuites name="classinshop-test-suite" tests="0" failures="0" errors="0" skipped="0"></testsuites>' \
        > reports/latest/junit.xml
      echo "WARN: junit.xml missing after tests; wrote empty placeholder."
    fi
  - |
    echo "======== Enhanced Report ========"
    if [ -f reports/latest/enhanced/enhanced-report.html ]; then
      echo "Local path: reports/latest/enhanced/enhanced-report.html"
      echo "Browse artifacts in this job, or wait for pages job for online URL."
      ls -la reports/latest/enhanced/ | head -20
    else
      echo "WARN: Enhanced report not found under reports/latest/enhanced/"
      ls -la reports/latest/ || true
    fi
    echo "================================="

# 接口自动化：每次都跑，是最低红线。
test-api:
  stage: test
  image: ${PLAYWRIGHT_IMAGE}
  needs:
    - job: prepare
      artifacts: true
  script:
    - *install
    - *prepare_report_dirs
    # 串行执行：被测环境 WAF 会拦截并发突发请求
    - pnpm exec playwright test --project=api --workers=1
  after_script:
    - *ensure_report_artifacts
  artifacts:
    when: always
    optional: true
    expose_as: 'Enhanced Report API'
    paths:
      - reports/
    reports:
      junit: reports/latest/junit.xml
    expire_in: 1 week

# E2E：仅在分支 13/14/im 与 schedule 跑（依赖可访问站点 + 浏览器），失败不阻断主流程。
test-e2e:
  stage: test
  image: ${PLAYWRIGHT_IMAGE}
  needs:
    - job: prepare
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(13|14|im)$/
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true
  script:
    - *install
    - *prepare_report_dirs
    - pnpm exec playwright test --project=e2e-web --project=e2e-mobile
  after_script:
    - *ensure_report_artifacts
  artifacts:
    when: always
    optional: true
    expose_as: 'Enhanced Report E2E'
    paths:
      - reports/
    reports:
      junit: reports/latest/junit.xml
    expire_in: 1 week

# 发布 Enhanced HTML 到 GitLab Pages，流水线结束后可在线打开。
pages:
  stage: report
  image: ${PLAYWRIGHT_IMAGE}
  needs:
    - job: test-api
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH =~ /^(13|14|im)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true
  script:
    - mkdir -p public
    - |
      if [ -d reports/latest/enhanced ] && [ -f reports/latest/enhanced/enhanced-report.html ]; then
        cp -r reports/latest/enhanced/* public/
        echo "Published Enhanced report to GitLab Pages (public/)."
      elif [ -d reports/latest/html ] && ls reports/latest/html/index.html >/dev/null 2>&1; then
        cp -r reports/latest/html/* public/
        echo "Published Playwright HTML report to GitLab Pages (fallback)."
      else
        echo "WARN: no report under reports/latest; publishing placeholder."
        printf '%s\n' '<!doctype html><meta charset="utf-8"><title>No report</title><h1>No test report generated</h1>' > public/index.html
      fi
      ls -la public/ | head -20
    - |
      echo "======== Online Report ========"
      echo "Pages URL (after deploy): ${CI_PAGES_URL}"
      echo "Entry: ${CI_PAGES_URL}/enhanced-report.html"
      echo "Or open Job artifacts → reports/latest/enhanced/enhanced-report.html"
      echo "================================"
  environment:
    name: test-report/$CI_COMMIT_REF_SLUG
    url: $CI_PAGES_URL/enhanced-report.html
  artifacts:
    when: always
    optional: true
    paths:
      - public
    expire_in: 1 week
